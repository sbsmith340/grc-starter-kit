name: ci

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install openpyxl pytest
      - run: pytest -q tests
      # The example register is evaluated as of its publication date so example
      # acceptance expiries don't fail the build. Drop --today for a real register.
      - name: Validate example risk register
        run: python tools/risk_report.py register/risk_register.csv --check --today 2026-10-21
